[project]
name = "clawdmeter"
version = "0.1.0"
description = "macOS daemon that pushes Claude rate-limit and Superset focus state to a Clawdmeter BLE device"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"

[tool.setuptools.packages.find]
where = ["src"]
