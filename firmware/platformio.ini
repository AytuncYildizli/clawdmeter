[platformio]
default_envs = m5stack-core2

[env]
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
build_unflags = -std=gnu++11

[env:m5stack-core2]
platform = espressif32
board = m5stack-core2
framework = arduino
upload_speed = 921600
upload_port = /dev/cu.usbserial-56A40083721
monitor_port = /dev/cu.usbserial-56A40083721
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    ; NimBLE peripheral configuration
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=1
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=0
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=0
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
    ; LVGL build flags
    -DLV_CONF_SKIP
    -DLV_COLOR_DEPTH=16
    -DLV_USE_LOG=0
    -DLV_USE_LABEL=1
    -DLV_USE_IMG=1
    -DLV_USE_OBJ=1
    -DLV_TICK_CUSTOM=1
lib_deps =
    m5stack/M5Unified@^0.2.6
    bblanchon/ArduinoJson@^7.0.0
    h2zero/NimBLE-Arduino@^2.1.1
    ; NOTE: lvgl/lvgl@^9.2.0 deferred to Task 7. M5GFX (pulled in by M5Unified)
    ; bundles a vendored subset of LVGL font code, causing multiple-definition
    ; link errors when lvgl is added blindly to lib_deps. Task 7 needs an
    ; extra_scripts hook or build_src_filter to exclude
    ; .pio/libdeps/m5stack-core2/M5GFX/src/lgfx/v1/lv_font/ and
    ; .pio/libdeps/m5stack-core2/M5GFX/src/lgfx/Fonts/lvgl/ before linking.

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=gnu++17
    -DUNIT_TEST
    -I src
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
; main.cpp gates its Arduino/M5Unified content behind #ifndef UNIT_TEST so it
; compiles on the host. Host-testable modules (theme.h, layout_math,
; payload_parser, ...) live alongside main.cpp in src/ and the tests pull them
; in directly. test_build_src=yes pulls src/*.cpp into each test binary so the
; tests can link against payload_parser.cpp, auto_rotate.cpp, layout_math.cpp.
