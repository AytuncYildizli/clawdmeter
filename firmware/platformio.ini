; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = m5stack-core2

[env]
monitor_speed = 115200
build_flags = 
	-std=gnu++17
	-DCORE_DEBUG_LEVEL=3
build_unflags = -std=gnu++11

[env:m5stack-core2]
platform = espressif32
board = m5stack-core2
framework = arduino
upload_speed = 921600
upload_port = /dev/cu.usbserial-56A40083721
monitor_port = /dev/cu.usbserial-56A40083721
build_flags = 
	${env.build_flags}
	-DBOARD_HAS_PSRAM
	-DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=1
	-DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL=1
	-DCONFIG_BT_NIMBLE_ROLE_CENTRAL=0
	-DCONFIG_BT_NIMBLE_ROLE_OBSERVER=0
	-DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
	-DLV_CONF_SKIP
	-DLV_COLOR_DEPTH=16
	-DLV_USE_LOG=0
	-DLV_USE_LABEL=1
	-DLV_USE_IMG=1
	-DLV_USE_OBJ=1
	-DLV_TICK_CUSTOM=1
	-DLV_FONT_MONTSERRAT_14=1
	-DLV_FONT_MONTSERRAT_48=1
extra_scripts = 
	pre:scripts/strip_m5gfx_lvgl.py
lib_deps = 
	m5stack/M5Unified@^0.2.6
	bblanchon/ArduinoJson@^7.0.0
	h2zero/NimBLE-Arduino@^2.1.1
	lvgl/lvgl@^9.2.0

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<*> -<ui_meter.cpp> -<ui_pager.cpp> -<ble_peer.cpp> -<main.cpp>
build_flags = 
	-std=gnu++17
	-DUNIT_TEST
	-I src
lib_deps = 
	bblanchon/ArduinoJson@^7.0.0
